[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlchat-agent-python"
version = "0.3.0"
description = "对话式数据库分析 AI Agent（只读 SQL 工具集 / SSE 流式 / 表级 ACL / 审计与指标）— Go 版 sqlchat-agent-go 的 Python 3 实现"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mysqlagent = "mysqlagent.main:main"

[tool.setuptools.packages.find]
include = ["mysqlagent*"]

[tool.setuptools.package-data]
mysqlagent = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
