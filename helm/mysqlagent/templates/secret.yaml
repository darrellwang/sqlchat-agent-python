apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysqlagent.name" . }}
  labels:
    {{- include "mysqlagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  llm-api-key: {{ .Values.llm.apiKey | default "" | quote }}
  database-dsn: {{ .Values.database.dsn | default "" | quote }}
{{- if .Values.server.apiKeys }}
  api-keys: {{ include "mysqlagent.apiKeysEnv" . | quote }}
{{- end }}
